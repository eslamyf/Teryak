<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>404 - الصفحة غير موجودة | تِرياق</title>
  <!-- Favicon / Brand Logo -->
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <link rel="apple-touch-icon" href="/assets/images/logo.png">
  <meta name="robots" content="noindex, nofollow">

  <!-- Anti-flicker Theme Script: Executed synchronously before ANY CSS or DOM paint -->
  <script>
    (function(){try{var saved=localStorage.getItem('teryak_theme')||localStorage.getItem('theme');var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;var isDark=saved==='dark'||(!saved&&prefersDark);if(isDark){document.documentElement.setAttribute('data-theme','dark');document.documentElement.classList.add('dark-theme');document.documentElement.style.backgroundColor='#0b1120';document.documentElement.style.colorScheme='dark';}else{document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.remove('dark-theme');document.documentElement.style.backgroundColor='#f8fafc';document.documentElement.style.colorScheme='light';}}catch(e){}})();
  </script>

  <!-- Typography: Cairo Exclusively -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Base & Component CSS (Root-relative so it works from any URL depth) -->
  <link rel="stylesheet" href="/css/base/variables.css?v=20261030_8">
  <link rel="stylesheet" href="/css/base/global.css?v=20261030_8">
  <link rel="stylesheet" href="/css/components/navbar.css?v=20261030_8">
  <link rel="stylesheet" href="/css/components/components.css?v=20261030_8">
  <link rel="stylesheet" href="/css/components/footer.css?v=20261030_8">
  <link rel="stylesheet" href="/css/components/modal.css?v=20261030_8">
</head>
<body data-page="404">

  <!-- Reusable Unified App Navbar (Header & Navigation) -->
  <app-navbar></app-navbar>

  <div id="spa-content">
    <style>
      .error-404-section {
        min-height: calc(100vh - 180px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px 64px;
        position: relative;
        overflow: hidden;
      }

      .error-404-card {
        width: min(680px, 100%);
        background: var(--bg-card, #ffffff);
        border: 1.5px solid var(--border-color, #e2e8f0);
        border-radius: 28px;
        padding: 48px 36px;
        text-align: center;
        box-shadow: 0 20px 50px -12px rgba(0, 139, 94, 0.08), 0 4px 16px rgba(0, 0, 0, 0.03);
        position: relative;
        z-index: 2;
      }

      [data-theme="dark"] .error-404-card,
      body.dark-theme .error-404-card {
        background: #111827 !important;
        border-color: #1f2937 !important;
        box-shadow: 0 24px 60px -15px rgba(0, 0, 0, 0.55);
      }

      .error-404-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px;
        border-radius: 999px;
        background: rgba(0, 139, 94, 0.1);
        color: var(--primary-color, #008b5e);
        font-size: 13.5px;
        font-weight: 800;
        margin-bottom: 20px;
      }

      .error-404-visual {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin: 4px 0 22px;
        user-select: none;
      }

      .error-404-digit {
        font-size: clamp(72px, 12vw, 115px);
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(135deg, #008b5e 0%, #10b981 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -2px;
      }

      .error-404-icon-circle {
        width: clamp(68px, 11vw, 96px);
        height: clamp(68px, 11vw, 96px);
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(0, 139, 94, 0.14) 0%, rgba(16, 185, 129, 0.22) 100%);
        border: 3px solid rgba(0, 139, 94, 0.25);
        display: grid;
        place-items: center;
        color: var(--primary-color, #008b5e);
        font-size: clamp(30px, 5vw, 44px);
        animation: pulseFloat404 3s ease-in-out infinite;
      }

      @keyframes pulseFloat404 {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(6deg); }
      }

      .error-404-title {
        font-size: clamp(22px, 3.5vw, 30px);
        font-weight: 800;
        color: var(--text-main, #0f172a);
        margin-bottom: 12px;
        line-height: 1.4;
      }

      .error-404-desc {
        font-size: 16px;
        color: var(--text-muted, #64748b);
        max-width: 34em;
        margin: 0 auto 20px;
        line-height: 1.75;
      }

      .error-404-path-box {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
        background: var(--bg-muted, #f1f5f9);
        border: 1px dashed var(--border-color, #cbd5e1);
        border-radius: 12px;
        padding: 8px 16px;
        font-size: 13.5px;
        color: var(--text-muted, #64748b);
        margin-bottom: 26px;
        direction: ltr;
        word-break: break-all;
      }

      [data-theme="dark"] .error-404-path-box,
      body.dark-theme .error-404-path-box {
        background: #1e293b !important;
        border-color: #334155 !important;
        color: #94a3b8 !important;
      }

      .error-404-search {
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 500px;
        margin: 0 auto 28px;
        background: var(--bg-muted, #f8fafc);
        border: 1.5px solid var(--border-color, #e2e8f0);
        border-radius: 16px;
        padding: 6px;
        transition: all 0.2s ease;
      }

      [data-theme="dark"] .error-404-search,
      body.dark-theme .error-404-search {
        background: #1e293b !important;
        border-color: #334155 !important;
      }

      .error-404-search:focus-within {
        border-color: var(--primary-color, #008b5e);
        background: var(--bg-card, #ffffff);
        box-shadow: 0 0 0 4px rgba(0, 139, 94, 0.1);
      }

      .error-404-search input {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        padding: 10px 14px;
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
        outline: none;
      }

      .error-404-search button {
        padding: 10px 20px;
        border-radius: 12px;
        font-size: 14.5px;
        font-weight: 700;
        white-space: nowrap;
      }

      .error-404-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .error-404-actions .btn {
        min-width: 170px;
        padding: 12px 22px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      @media (max-width: 600px) {
        .error-404-card {
          padding: 34px 20px;
          border-radius: 22px;
        }
        .error-404-search {
          flex-direction: column;
          padding: 8px;
        }
        .error-404-search input,
        .error-404-search button {
          width: 100%;
          text-align: center;
        }
        .error-404-actions {
          flex-direction: column;
          width: 100%;
        }
        .error-404-actions .btn {
          width: 100%;
        }
      }
    </style>

    <main class="error-404-section">
      <div class="error-404-card">
        <div class="error-404-badge">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>خطأ 404 · المسار غير موجود</span>
        </div>

        <div class="error-404-visual" aria-hidden="true">
          <span class="error-404-digit">4</span>
          <div class="error-404-icon-circle">
            <i class="fa-solid fa-capsules"></i>
          </div>
          <span class="error-404-digit">4</span>
        </div>

        <h1 class="error-404-title">عفواً.. الصفحة أو المسار الذي تبحث عنه غير موجود!</h1>
        <p class="error-404-desc">
          يبدو أنك كتبت رابطاً غير صحيح أو أن الصفحة قد تم نقلها. يمكنك البحث مباشرة عن الدواء بالأسفل أو العودة للصفحة الرئيسية.
        </p>

        <div class="error-404-path-box" id="wrongPathDisplay" title="المسار المطلوب">
          <i class="fa-solid fa-link-slash" style="color:#ef4444;"></i>
          <span id="wrongPathText">/404</span>
        </div>

        <!-- Quick Medicine Search directly from 404 page -->
        <form class="error-404-search" id="error404SearchForm" action="/pages/public/medicines.html" method="get">
          <i class="fa-solid fa-magnifying-glass" style="color:var(--primary-color);padding-inline-start:10px;"></i>
          <input type="search" name="q" id="error404SearchInput" placeholder="ابحث عن دواء أو منتج (مثل: بانادول، أوجمنتين، ميبو)..." aria-label="ابحث عن دواء">
          <button type="submit" class="btn btn-brand">ابحث الآن</button>
        </form>

        <!-- Navigation Buttons -->
        <div class="error-404-actions">
          <a href="/index.html" class="btn btn-brand">
            <i class="fa-solid fa-house"></i>
            <span>العودة للرئيسية</span>
          </a>
          <a href="/pages/public/medicines.html" class="btn btn-line">
            <i class="fa-solid fa-pills"></i>
            <span>دليل الأدوية والمنتجات</span>
          </a>
          <a href="/pages/public/prescription.html" class="btn btn-line">
            <i class="fa-solid fa-file-prescription"></i>
            <span>رفع روشتة طبية</span>
          </a>
        </div>
      </div>
    </main>

    <!-- Reusable Unified App Footer -->
    <app-footer></app-footer>
  </div>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <script>
    (function () {
      try {
        var pathEl = document.getElementById('wrongPathText');
        if (pathEl) {
          pathEl.textContent = decodeURIComponent(window.location.pathname + window.location.search);
        }
        var form = document.getElementById('error404SearchForm');
        var input = document.getElementById('error404SearchInput');
        if (form && input) {
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            var q = input.value.trim();
            window.location.href = '/pages/public/medicines.html' + (q ? '?q=' + encodeURIComponent(q) : '');
          });
        }
      } catch (err) {}
    })();
  </script>

  <!-- Vendor & Core Scripts (Root-relative so they load from any URL depth) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js?v=20261030_8"></script>
  <script src="/js/core/toast.js?v=20261030_8"></script>
  <script src="/js/core/validation.js?v=20261030_8"></script>
  <script src="/js/core/api.js?v=20261030_8"></script>
  <script src="/js/core/auth.js?v=20261030_8"></script>
  <script src="/js/core/cart.js?v=20261030_8"></script>
  <script src="/js/components/app-navbar.js?v=20261030_8"></script>
  <script src="/js/components/app-footer.js?v=20261030_8"></script>
  <script src="/js/components/app-cart-modal.js?v=20261030_8"></script>
  <script src="/js/core/spa-router.js?v=20261030_8"></script>
</body>
</html>
