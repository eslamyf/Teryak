<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e6f7ef" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008b5e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10c38c" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="glowCircle" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10c38c" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#008b5e" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="medicalGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#008b5e" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="60" cy="0" r="1.5" fill="#008b5e" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Subtle Medical Matrix Grid -->
  <rect width="1920" height="1080" fill="url(#medicalGrid)" />

  <!-- Ambient Light Halos -->
  <circle cx="960" cy="420" r="550" fill="url(#glowCircle)" />
  <circle cx="280" cy="300" r="400" fill="url(#primaryGrad)" />
  <circle cx="1650" cy="750" r="480" fill="url(#primaryGrad)" />

  <!-- Decorative Medical Icons & Modern Shapes -->
  <g fill="none" stroke="#008b5e" stroke-linecap="round" stroke-linejoin="round" opacity="0.12">
    <!-- Big Stylized Cross Top Right -->
    <path d="M1520 180 h120 v-120 h120 v120 h120 v120 h-120 v120 h-120 v-120 h-120 z" stroke-width="8" />
    
    <!-- Big Stylized Capsule Left Side -->
    <g transform="translate(180, 520) rotate(-35)">
      <rect x="0" y="0" width="280" height="110" rx="55" stroke-width="6" />
      <line x1="140" y1="0" x2="140" y2="110" stroke-width="5" />
      <path d="M40 55 h60" stroke-width="4" />
    </g>

    <!-- Medical Pulse Wave Center Bottom -->
    <path d="M400 920 h300 l40 -60 l50 120 l60 -150 l50 90 h400" stroke-width="6" />

    <!-- Pharmacy Bottle Shape Right -->
    <g transform="translate(1480, 480)">
      <rect x="50" y="0" width="100" height="40" rx="10" stroke-width="6" />
      <path d="M20 40 h160 a20 20 0 0 1 20 20 v220 a30 30 0 0 1 -30 30 h-140 a30 30 0 0 1 -30 -30 v-220 a20 20 0 0 1 20 -20 z" stroke-width="6" />
      <path d="M100 120 v80 M60 160 h80" stroke-width="6" />
    </g>

    <!-- Small floating pills & particles -->
    <circle cx="340" cy="220" r="28" stroke-width="4" />
    <circle cx="1680" cy="280" r="18" stroke-width="3" />
    <circle cx="820" cy="160" r="14" stroke-width="3" />
    <circle cx="1120" cy="180" r="20" stroke-width="4" />
    <circle cx="680" cy="850" r="16" stroke-width="3" />
    <circle cx="1350" cy="880" r="24" stroke-width="4" />
  </g>
</svg>
