<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصيدليات | تِرياق</title>
  <meta name="description" content="الصيدليات القريبة منك - كل الصيدليات اللي معانا، وأقربهم ليك أول حاجة.">

  <!-- Anti-flicker Theme Script -->
  <script>
    (function(){try{var t=localStorage.getItem('teryak_theme')||localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');if(document.body){document.body.classList.add('dark-theme');}else{document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('dark-theme');});}}else{document.documentElement.removeAttribute('data-theme');}}catch(e){}})();
  </script>

  <!-- Typography: Cairo, Alexandria, Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Alexandria:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/components.css">
  <link rel="stylesheet" href="../../css/components/modal.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/public/pharmacies.css">
</head>
<body data-page="pharmacies">

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <div id="spa-content">
    <main class="wrap">
    <!-- Right-Aligned Page Header Pitch -->
    <div class="ph">
      <h1>الصيدليات القريبة منك</h1>
      <p>كل الصيدليات اللي معانا، وأقربهم ليك أول حاجة.</p>
    </div>

    <!-- Toolbar: Search, Sort, Filter -->
    <div class="bar">
      <label class="field">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input type="search" id="searchInput" placeholder="اسم الصيدلية أو العنوان" aria-label="بحث عن صيدلية">
      </label>

      <select class="sel" id="sortSelect" aria-label="الترتيب">
        <option value="distance">الأقرب أولاً</option>
        <option value="rating">الأعلى تقييماً</option>
        <option value="meds">الأكثر أدوية</option>
      </select>

      <button class="sel" id="filterBtn" type="button">المفتوحة الآن فقط</button>
    </div>

    <!-- Results Count -->
    <p class="count" id="resultCount">بنعرض <b>6</b> صيدليات</p>

    <!-- Split Layout: List + Sticky Side Panel -->
    <div class="split">
      <!-- Pharmacy Cards Container -->
      <div id="pharmacyList"></div>

      <!-- Sticky Side Stats Panel -->
      <aside class="side">
        <div class="card" id="topPanel"></div>
        <div class="card" id="openNowCard">
          <h3>مفتوحة الآن</h3>
          <div id="openNowList"></div>
        </div>
      </aside>
    </div>
  </main>

    <!-- Reusable App Footer -->
    <app-footer></app-footer>
  </div>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>
  <script src="../../js/core/spa-router.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/public/pharmacies.js"></script>
</body>
</html>
