  <!-- Anti-flicker Theme Script: Executed synchronously before ANY CSS or DOM paint -->
  <script>
    (function(){try{var saved=localStorage.getItem('teryak_theme')||localStorage.getItem('theme');var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;var isDark=saved==='dark'||(!saved&&prefersDark);if(isDark){document.documentElement.setAttribute('data-theme','dark');document.documentElement.classList.add('dark-theme');document.documentElement.style.backgroundColor='#0b1120';document.documentElement.style.colorScheme='dark';}else{document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.remove('dark-theme');document.documentElement.style.backgroundColor='#f8fafc';document.documentElement.style.colorScheme='light';}}catch(e){}})();
  </script>

      [data-theme="dark"] .catalog-filter-hub .field:focus-within,

      .catalog-filter-hub .sel {

        padding: 0 18px !important;
        background: var(--bg-card, #ffffff) !important;
        font-weight: 700 !important;
        font-size: 14.5px !important;
        color: var(--text-main) !important;
        cursor: pointer !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 8px !important;

      body.dark-theme .catalog-filter-hub .sel {
        background: #1e293b !important;
        border-color: #334155 !important;

      .catalog-filter-hub .sel:hover,

      }
      .categories-bar-divider {

        background: var(--border-color, #e2e8f0);
        margin: 16px 0 14px;

      }
      #quickCategoriesBar {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: flex-start !important;
        align-items: center !important;
        gap: 9px !important;
        width: 100% !important;
        padding: 2px 0 !important;
        margin: 0 !important;

      #quickCategoriesBar .chip {

        width: auto !important;
        min-width: max-content !important;

        height: auto !important;
        white-space: nowrap !important;
        padding: 9px 15px !important;
        border-radius: 13px !important;
        font-size: 13.5px !important;
        font-weight: 700 !important;
        border: 1.5px solid var(--border-color, #e2e8f0) !important;
        background: var(--bg-muted, #f8fafc) !important;
        color: var(--text-main, #0f172a) !important;
        cursor: pointer !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 8px !important;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
        line-height: 1.3 !important;
        overflow: visible !important;

      [data-theme="dark"] #quickCategoriesBar .chip,
      body.dark-theme #quickCategoriesBar .chip {
        background: #1e293b !important;
        border-color: #334155 !important;
        color: #f1f5f9 !important;

        color: var(--primary-color, #008b5e);

      #quickCategoriesBar .chip:hover {
        border-color: var(--primary-color, #008b5e) !important;
        background: rgba(0, 139, 94, 0.05) !important;
        color: var(--primary-color, #008b5e) !important;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 139, 94, 0.1);
      }
      #quickCategoriesBar .chip.on,
      #quickCategoriesBar .chip.active {
        background: linear-gradient(135deg, #008b5e 0%, #059669 100%) !important;
        border-color: #008b5e !important;
        color: #ffffff !important;

      #quickCategoriesBar .chip.active .cat-count {

      /* Advanced Drawer */
      .advanced-filter-drawer {
        border-top: 1px dashed var(--border-color, #e2e8f0);
        margin-top: 16px;
        padding-top: 16px;
      }
      .adv-filter-grid {

        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

      }
      .filter-section-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 14px;
        color: var(--text-main);
      }
      .filter-section-title i {
        color: var(--primary-color, #008b5e);
      }
      .filter-pills-group {
        display: flex !important;
        gap: 8px !important;
        flex-wrap: wrap !important;
      }
      .filter-pills-group .filter-pill {
        flex: 0 0 auto !important;
        width: auto !important;
        padding: 7px 14px !important;
        border-radius: 10px !important;
        font-size: 13px !important;
        font-weight: 700 !important;
        border: 1.5px solid var(--border-color, #e2e8f0) !important;
        background: var(--bg-card, #ffffff) !important;
        color: var(--text-main) !important;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      [data-theme="dark"] .filter-pills-group .filter-pill,
      body.dark-theme .filter-pills-group .filter-pill {
        background: #1e293b !important;
        border-color: #334155 !important;
        color: #f1f5f9 !important;
      }
      .filter-pills-group .filter-pill.on,
      .filter-pills-group .filter-pill.active {
        background: var(--primary-color, #008b5e) !important;
        border-color: var(--primary-color, #008b5e) !important;
        color: #ffffff !important;
      }
      .results-meta-row {

        flex-wrap: wrap;
        gap: 10px;
        margin: 14px 4px 18px;
      }
      .results-meta-row .count {
        margin: 0 !important;
        font-size: 15px;
      }
      /* Mobile & Tablet Responsive Design */
      @media (max-width: 768px) {
        .catalog-filter-hub {
          padding: 14px;
          border-radius: 18px;

        .catalog-filter-hub .bar {

          gap: 10px !important;
        }
        .catalog-filter-hub .field {
          flex: 1 1 auto !important;
          width: 100% !important;
          min-height: 46px !important;
        }
        .filter-actions-group {
          width: 100% !important;
          display: grid !important;
          grid-template-columns: 1fr auto !important;
          gap: 8px !important;
        }
        .sort-select-wrap,
        .sort-select-wrap .sel {
          width: 100% !important;
          min-height: 44px !important;
          font-size: 13.5px !important;
        }
        #filterBtn {
          min-height: 44px !important;
          padding: 0 14px !important;
          font-size: 13.5px !important;
        }
        #quickCategoriesBar {
          flex-wrap: nowrap !important;
          overflow-x: auto !important;
          overflow-y: hidden !important;
          -webkit-overflow-scrolling: touch !important;

          padding-bottom: 4px !important;

        }

          scroll-snap-align: start;
          padding: 8px 13px !important;
          font-size: 13px !important;
