<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الأدوية | تِرياق</title>
  <meta name="description" content="دليل الأدوية الشامل في تِرياق - دوّر على دواك، وقارن الأسعار، واحجز من أقرب صيدلية معتمدة.">

  <!-- Anti-flicker Theme Script -->
  <script>
    (function(){try{var t=localStorage.getItem('teryak_theme')||localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');if(document.body){document.body.classList.add('dark-theme');}else{document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('dark-theme');});}}else{document.documentElement.removeAttribute('data-theme');}}catch(e){}})();
  </script>

  <!-- Typography: Cairo, Alexandria, Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Alexandria:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/components.css">
  <link rel="stylesheet" href="../../css/components/modal.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/public/medicines.css">
</head>
<body data-page="medicines">

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <div id="spa-content">
    <main class="wrap">
    <!-- Right-Aligned Page Header Pitch -->
    <div class="ph">
      <h1>دليل الأدوية</h1>
      <p>دوّر على دواك، وقارن الأسعار، واحجز من أقرب صيدلية.</p>
    </div>

    <!-- Search & Sort Bar -->
    <div class="bar">
      <label class="field">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input type="search" id="searchInput" placeholder="اسم الدوا، المادة الفعالة، أو الاستخدام" aria-label="بحث عن دواء">
        <button type="button" id="clearSearchBtn" class="clear-search-btn hide" aria-label="مسح البحث" style="border:none;background:none;font-size:18px;color:var(--text-muted);cursor:pointer;padding:0 4px;">&times;</button>
      </label>

      <select class="sel" id="sortSelect" aria-label="الترتيب">
        <option value="default">الترتيب الافتراضي</option>
        <option value="priceLow">الأرخص</option>
        <option value="priceHigh">الأعلى سعراً</option>
        <option value="rating">الأعلى تقييماً</option>
        <option value="availability">الأكثر توفراً</option>
        <option value="name">الاسم أبجدياً (أ - ي)</option>
      </select>

      <button class="sel" id="filterBtn" type="button">
        فلاتر
        <span id="activeFilterBadge" class="filter-badge hide" style="background:var(--primary-color);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-inline-start:4px;">0</span>
      </button>
    </div>

    <!-- Quick Category Chips (Scrollable with hidden scrollbar) -->
    <div class="chips" role="tablist" id="quickCategoriesBar">
      <button type="button" class="chip on active" data-category="all">كل الأدوية</button>
      <button type="button" class="chip" data-category="مسكنات">مسكنات وسيولة</button>
      <button type="button" class="chip" data-category="مضادات حيوية">مضادات حيوية</button>
      <button type="button" class="chip" data-category="قلب وضغط">قلب وضغط</button>
      <button type="button" class="chip" data-category="فيتامينات">فيتامينات</button>
      <button type="button" class="chip" data-category="مكملات غذائية">مكملات غذائية</button>
      <button type="button" class="chip" data-category="نزلات برد">نزلات البرد</button>
      <button type="button" class="chip" data-category="هضمي">جهاز هضمي</button>
      <button type="button" class="chip" data-category="عناية شخصية">عناية شخصية</button>
      <button type="button" class="chip" data-category="مستلزمات طبية">مستلزمات طبية</button>
    </div>

    <!-- Advanced Collapsible Filter Drawer -->
    <div id="filter" class="advanced-filter-drawer hide" style="display:none;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--border-radius-lg);padding:20px;margin-top:16px;">
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:20px;">
        <div class="filter-section">
          <label style="display:block;font-weight:700;margin-bottom:10px;font-size:15px;color:var(--text-main);">حالة التوفر في الصيدليات</label>
          <div class="filter-pills-group" id="statusFilterGroup" style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="chip filter-pill on active" data-filter="all">الكل</button>
            <button type="button" class="chip filter-pill" data-filter="available">متوفر فوراً</button>
            <button type="button" class="chip filter-pill" data-filter="limited">كمية محدودة</button>
            <button type="button" class="chip filter-pill" data-filter="unavailable">غير متوفر</button>
          </div>
        </div>

        <div class="filter-section">
          <label style="display:block;font-weight:700;margin-bottom:10px;font-size:15px;color:var(--text-main);">نطاق السعر (ج.م)</label>
          <div class="filter-pills-group" id="priceFilterGroup" style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="chip filter-pill on active" data-price-range="all">جميع الأسعار</button>
            <button type="button" class="chip filter-pill" data-price-range="under30">أقل من 30 ج.م</button>
            <button type="button" class="chip filter-pill" data-price-range="30to60">30 - 60 ج.م</button>
            <button type="button" class="chip filter-pill" data-price-range="over60">أكثر من 60 ج.م</button>
          </div>
        </div>
      </div>

      <div style="margin-top:16px;text-align:start;">
        <button type="button" id="resetFiltersBtn" class="btn btn-line" style="font-size:14px;padding:6px 18px;">
          إعادة تعيين كافة الفلاتر
        </button>
      </div>
    </div>

    <!-- Results Count Line & Active Filter Chips -->
    <p class="count" id="countLine">عرض <b id="resultsCount">1 - 6</b> من <b id="totalCount">13</b> دوا</p>
    <div class="active-chips-container" id="activeChipsContainer" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;"></div>

    <!-- Medicines Grid (3 Columns Desktop, 2 Tablet, 1 Mobile) -->
    <div class="grid3" id="medicinesGrid">
      <div style="grid-column:1/-1;text-align:center;padding:48px 0;">
        <i class="fa-solid fa-circle-notch fa-spin text-success fs-1 mb-3"></i>
        <p style="color:var(--text-muted);font-weight:700;">جاري تحميل الأدوية...</p>
      </div>
    </div>

    <!-- Square Pagination Navigation -->
    <div class="pager hide" id="paginationNav">
      <button type="button" id="prevPageBtn" aria-label="السابق">السابق</button>
      <div id="pageNumbersContainer" style="display:inline-flex;gap:8px;"></div>
      <button type="button" id="nextPageBtn" aria-label="التالي">التالي</button>
    </div>
    <div id="paginationInfo" class="pagination-info hide" style="text-align:center;margin-top:12px;color:var(--text-muted);font-size:14px;"></div>

    <!-- Empty State -->
    <div id="noResultsState" class="card hide" style="display:none;padding:50px 24px;text-align:center;margin-top:24px;">
      <h3 style="margin-bottom:8px;font-size:22px;">لم نجد أدوية مطابقة للبحث</h3>
      <p style="color:var(--text-muted);margin-bottom:20px;">جرّب تعديل مصطلحات البحث أو مسح الفلاتر المحددة لعرض أدوية تانية.</p>
      <button type="button" class="btn btn-brand" id="emptyResetBtn" style="margin-inline:auto;">
        عرض كل الأدوية
      </button>
    </div>
  </main>

    <!-- Reusable App Footer -->
    <app-footer></app-footer>
  </div>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>
  <script src="../../js/core/spa-router.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/public/medicines.js"></script>
</body>
</html>
