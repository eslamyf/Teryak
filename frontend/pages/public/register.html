<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | إنشاء حساب جديد</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="../../css/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/vendor/fontawesome/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/public/login.css">
</head>
<body>

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <main class="container my-5 pt-4">
    <section class="hero text-center mb-4">
      <h1>إنشاء حساب جديد</h1>
      <p class="text-muted">انضم إلى شبكة منصة ترياق الطبية</p>
    </section>

    <!-- Register Card -->
    <form id="registerForm" class="auth-card mx-auto" style="max-width: 520px;">
      <!-- User Type Selection Tabs -->
      <div class="tabs mb-4">
        <button type="button" class="tab active">مريض</button>
        <button type="button" class="tab">صيدلي</button>
      </div>

      <!-- Pharmacy Name (Only for Pharmacists) -->
      <div class="form-group pharmacist-field mb-3" style="display: none;">
        <label class="form-label">اسم الصيدلية</label>
        <div class="input-box">
          <i class="fa-solid fa-prescription-bottle-medical"></i>
          <input type="text" placeholder="مثال: صيدلية النور" id="pharmacyName">
        </div>
      </div>

      <!-- Email -->
      <div class="form-group mb-3">
        <label class="form-label">البريد الإلكتروني</label>
        <div class="input-box">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" placeholder="example@gmail.com" required id="email">
        </div>
      </div>

      <!-- Phone -->
      <div class="form-group mb-3">
        <label class="form-label">رقم الهاتف</label>
        <div class="input-box">
          <i class="fa-solid fa-phone"></i>
          <input type="tel" placeholder="01xxxxxxxxx" required id="phone">
        </div>
      </div>

      <!-- License Number (Only for Pharmacists) -->
      <div class="form-group pharmacist-field mb-3" style="display: none;">
        <label class="form-label">رقم ترخيص مزاولة المهنة / الصيدلية</label>
        <div class="input-box">
          <i class="fa-solid fa-id-card"></i>
          <input type="text" placeholder="رقم الترخيص" id="licenseNumber">
        </div>
      </div>

      <!-- Password -->
      <div class="form-group mb-3">
        <label class="form-label">كلمة المرور</label>
        <div class="input-box password-box">
          <i class="fa-solid fa-lock"></i>
          <input id="password" type="password" placeholder="••••••••" required>
          <i class="fa-solid fa-eye eye" style="cursor: pointer;"></i>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group mb-3">
        <label class="form-label">تأكيد كلمة المرور</label>
        <div class="input-box password-box">
          <i class="fa-solid fa-lock"></i>
          <input id="confirmPassword" type="password" placeholder="••••••••" required>
          <i class="fa-solid fa-eye eye" style="cursor: pointer;"></i>
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="termsCheck" required>
        <label class="form-check-label text-muted" for="termsCheck">
          أوافق على <a href="#" class="text-success">الشروط والأحكام</a> وسياسة الخصوصية
        </label>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2 font-bold mb-3" style="background-color: var(--primary-color);">
        إنشاء الحساب
      </button>

      <button type="button" class="google-btn w-100" id="SignWithG">
        <i class="fa-brands fa-google text-danger me-2"></i> التسجيل باستخدام Google
      </button>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted">لديك حساب بالفعل؟</span>
        <a href="login.html" class="text-success font-bold me-1">تسجيل الدخول</a>
      </div>
    </form>
  </main>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="../../js/vendor/bootstrap/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/public/register.js"></script>
</body>
</html>
