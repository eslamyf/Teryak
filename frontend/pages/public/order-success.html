<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | تم تأكيد طلبك بنجاح</title>
  <!-- Favicon / Brand Logo -->
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link rel="apple-touch-icon" href="../../assets/images/logo.png">

    <!-- Anti-flicker Theme Script: Executed synchronously before ANY CSS or DOM paint -->
  <script>
    (function(){try{var saved=localStorage.getItem('teryak_theme')||localStorage.getItem('theme');var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;var isDark=saved==='dark'||(!saved&&prefersDark);if(isDark){document.documentElement.setAttribute('data-theme','dark');document.documentElement.classList.add('dark-theme');document.documentElement.style.backgroundColor='#0b1120';document.documentElement.style.colorScheme='dark';}else{document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.remove('dark-theme');document.documentElement.style.backgroundColor='#f8fafc';document.documentElement.style.colorScheme='light';}}catch(e){}})();
  </script>

  <!-- Vendor CSS -->
    <!-- High-Performance Typography: Cairo (Preferred by Egyptian & Modern Pharmacies) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">
  <link rel="stylesheet" href="../../css/components/toast.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/public/order-success.css">
</head>
<body>

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <main class="container text-center my-5 pt-4">
    <div class="success-card p-4 p-md-5 mx-auto bg-white border rounded-4 shadow-sm" style="max-width: 620px;">
      <div class="mb-3 text-success">
        <i class="fa-solid fa-circle-check" style="font-size: 75px;"></i>
      </div>
      <h2 class="mt-2 font-bold text-success">تم تأكيد طلبك بنجاح!</h2>
      <p class="text-muted fs-5 mb-1" id="orderIdDisplay">رقم الطلب: #ORD-4620</p>
      <p class="text-muted small mb-4">تم إرسال تفاصيل الطلب للصيدلية المعتمدة وجاري تجهيزه للتسليم.</p>

      <!-- Order Details Container -->
      <div class="main border rounded-3 p-3 mb-4 bg-light text-start" id="orderSuccessDetails">
        <div id="orderSuccessItemsList" class="mb-3">
          <!-- Dynamically populated -->
          <div class="d-flex align-items-center gap-3">
            <img src="../../assets/images/parst.jpg" alt="Medicine" style="width: 50px; height: 50px; border-radius: 8px; object-fit: cover;">
            <div>
              <p class="font-bold mb-0">باراسيتامول 500 مجم</p>
              <small class="text-muted">صيدليه اسلام · جاري التجهيز</small>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between border-top pt-2">
          <span class="font-bold text-dark mb-0">الإجمالي المستحق</span>
          <span class="font-bold text-success fs-5 mb-0" id="orderSuccessTotal">39.50 ج.م</span>
        </div>
      </div>

      <div class="d-flex justify-content-center flex-wrap gap-2">
        <a href="patient-dashboard.html" class="btn btn-success py-2 px-4 font-bold rounded-3" style="background-color: var(--primary-color);">
          <i class="fa-solid fa-box-open me-1"></i> تتبع طلبي في لوحة التحكم
        </a>
        <a href="medicines.html" class="btn btn-outline-secondary py-2 px-4 font-bold rounded-3">
          <i class="fa-solid fa-pills me-1"></i> تصفح المزيد من الأدوية
        </a>
      </div>
    </div>
  </main>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>
  <script src="../../js/core/spa-router.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Clear cart on successful purchase
      if (window.Cart) {
        window.Cart.clearCart();
      }

      // Parse orderId from URL parameter
      const params = new URLSearchParams(window.location.search);
      const urlOrderId = params.get('orderId');

      let lastOrder = null;
      try {
        lastOrder = JSON.parse(sessionStorage.getItem('lastCreatedOrder'));
      } catch (e) {}

      const orderIdEl = document.getElementById('orderIdDisplay');
      const itemsListEl = document.getElementById('orderSuccessItemsList');
      const totalEl = document.getElementById('orderSuccessTotal');

      const finalOrderNumber = urlOrderId || lastOrder?.orderNumber || ('ORD-' + Math.floor(1000 + Math.random() * 9000));
      if (orderIdEl) {
        orderIdEl.textContent = `رقم الطلب: #${finalOrderNumber}`;
      }

      if (lastOrder && itemsListEl) {
        if (Array.isArray(lastOrder.items) && lastOrder.items.length > 0) {
          let itemsHtml = '';
          lastOrder.items.forEach(it => {
            const img = it.image || it.img || '../../assets/images/parst.jpg';
            const price = Number(it.price) || 25;
            const qty = Number(it.quantity) || 1;
            itemsHtml += `
              <div class="d-flex align-items-center justify-content-between mb-2">
                <div class="d-flex align-items-center gap-2">
                  <img src="${img}" alt="${it.name}" style="width: 44px; height: 44px; border-radius: 6px; object-fit: cover;" onerror="this.src='../../assets/images/parst.jpg'">
                  <div>
                    <strong class="d-block text-dark small">${it.name}</strong>
                    <small class="text-muted">الكمية: ${qty}</small>
                  </div>
                </div>
                <span class="font-bold text-success small">${(price * qty).toFixed(2)} ج.م</span>
              </div>
            `;
          });
          itemsListEl.innerHTML = itemsHtml;
        }

        if (totalEl && lastOrder.totalAmount) {
          totalEl.textContent = `${Number(lastOrder.totalAmount).toFixed(2)} ج.م`;
        }
      }
    });
  </script>
</body>
</html>
