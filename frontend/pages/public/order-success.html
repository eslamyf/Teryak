<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | تم تأكيد طلبك بنجاح</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/public/order-success.css">
</head>
<body>

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <main class="container text-center my-5 pt-4">
    <div class="success-card p-5 mx-auto" style="max-width: 600px;">
      <i class="bi bi-check-circle-fill text-success" style="font-size: 70px;"></i>
      <h2 class="mt-3 font-bold text-success">تم تأكيد طلبك بنجاح!</h2>
      <p class="parg text-muted fs-5" id="orderIdDisplay">رقم الطلب: #ORD-4620</p>
      <p class="parg text-muted mb-4">ستصلك رسالة تأكيد وتفاصيل المندوب على هاتفك خلال دقائق.</p>

      <div class="main border rounded p-3 mb-4 bg-light text-start">
        <div class="d-flex align-items-center gap-3 mb-3">
          <img src="../../assets/images/parst.jpg" alt="Medicine" style="width: 55px; height: 55px; border-radius: 8px;">
          <div class="first">
            <p class="font-bold mb-0">باراسيتامول 500 مجم</p>
            <small class="text-muted">صيدلية النهضة</small>
          </div>
        </div>
        <div class="d-flex1 d-flex justify-content-between border-top pt-2">
          <p class="font-bold mb-0">الإجمالي المدفوع</p>
          <p class="grn font-bold text-success mb-0">39.50 ج.م</p>
        </div>
      </div>

      <div class="d-flex justify-content-center gap-3">
        <a href="patient-dashboard.html" class="btn btn-success py-2 px-4 font-bold" style="background-color: var(--primary-color);">
          <i class="bi bi-box-seam me-1"></i> تتبع طلبي
        </a>
        <a href="../../index.html" class="btn btn-outline-secondary py-2 px-4 font-bold">
          العودة للرئيسية
        </a>
      </div>
    </div>
  </main>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Clear cart on successful purchase
      if (window.Cart) {
        window.Cart.clearCart();
      }
      const orderIdEl = document.getElementById('orderIdDisplay');
      if (orderIdEl) {
        orderIdEl.textContent = 'رقم الطلب: #ORD-' + Math.floor(1000 + Math.random() * 9000);
      }
    });
  </script>
</body>
</html>
