<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | تفاصيل المنتج والصيدليات المتوفرة</title>
  <!-- Favicon / Brand Logo -->
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link rel="apple-touch-icon" href="../../assets/images/logo.png">

    <!-- Anti-flicker Theme Script: Executed synchronously before ANY CSS or DOM paint -->
  <script>
    (function(){try{var saved=localStorage.getItem('teryak_theme')||localStorage.getItem('theme');var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;var isDark=saved==='dark'||(!saved&&prefersDark);if(isDark){document.documentElement.setAttribute('data-theme','dark');document.documentElement.classList.add('dark-theme');document.documentElement.style.backgroundColor='#0b1120';document.documentElement.style.colorScheme='dark';}else{document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.remove('dark-theme');document.documentElement.style.backgroundColor='#f8fafc';document.documentElement.style.colorScheme='light';}}catch(e){}})();
  </script>

  <!-- Vendor CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/public/medicine-detail.css">
</head>
<body data-page="medicine-detail">

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <main class="container py-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
      <div class="breadcrumb-bar d-flex align-items-center gap-2 text-muted" style="font-size: 13.5px;">
        <a href="../../index.html" class="text-decoration-none text-muted"><i class="fa-solid fa-house me-1"></i> الرئيسية</a>
        <span>/</span>
        <a href="medicines.html" class="text-decoration-none text-muted">الأدوية</a>
        <span>/</span>
        <span class="active-breadcrumb" id="breadcrumbName">تفاصيل الدواء</span>
      </div>
    </nav>

    <!-- Medicine Detail Hero Section -->
    <section class="card border-0 rounded-4 p-4 mb-4 medicine-hero-card" id="medicineHeroCard">
      <div class="row g-4 align-items-center">
        <!-- Medicine Image Showcase -->
        <div class="col-lg-4 col-md-5 text-center">
          <div class="medicine-main-image-wrap rounded-4 p-3 d-flex align-items-center justify-content-center position-relative">
            <span class="badge-rx-floating" id="medRxBadge">بدون روشتة (OTC)</span>
            <img id="medImage" src="../../assets/images/parst.jpg" alt="صورة الدواء" class="img-fluid rounded-3 medicine-featured-img">
          </div>
        </div>

        <!-- Medicine Information -->
        <div class="col-lg-8 col-md-7">
          <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
            <div class="d-flex flex-wrap gap-2">
              <span class="badge-pill-tag tag-primary" id="medCategoryBadge">أدوية عامة</span>
              <span class="badge-pill-tag tag-secondary" id="medFormBadge">أقراص</span>
            </div>

            <!-- Price Tag -->
            <div class="product-price-box">
              <span class="price-val" id="medPrice">--</span>
              <span class="price-curr">ج.م</span>
            </div>
          </div>

          <h1 class="product-title" id="medicineDetailTitle">جاري التحميل...</h1>
          <p class="product-subtitle text-muted" id="medicineDetailEn" style="display:none;"></p>

          <!-- Quick Specs Strip -->
          <div class="specs-grid my-3">
            <div class="spec-box">
              <i class="fa-solid fa-flask text-success"></i>
              <div>
                <small>المادة الفعالة</small>
                <strong id="medicineActiveIng">—</strong>
              </div>
            </div>
            <div class="spec-box">
              <i class="fa-solid fa-scale-balanced text-primary"></i>
              <div>
                <small>التركيز</small>
                <strong id="medConcentration">—</strong>
              </div>
            </div>
            <div class="spec-box spec-stock">
              <i class="fa-solid fa-circle-check text-success"></i>
              <div>
                <small>حالة التوفر</small>
                <strong id="medPharmacyCountText">جاري الفحص...</strong>
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
            <button type="button" class="btn btn-brand font-bold px-4 py-2" id="addToCartMainBtn">
              <i class="fa-solid fa-cart-shopping me-1"></i> أضف إلى السلة
            </button>
            <a href="#availablePharmaciesList" class="btn btn-outline-brand font-bold px-3 py-2">
              <i class="fa-solid fa-store me-1"></i> الصيدليات المتوفرة (<span id="pharmaciesCountBtn">0</span>)
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Available Pharmacies Section (Full Width) -->
    <div class="row">
      <div class="col-12">
        <div class="card p-4 border-0 rounded-4 mb-4 section-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 font-bold mb-0 text-dark d-flex align-items-center gap-2">
              <i class="fa-solid fa-store text-success"></i> الصيدليات المتوفر بها المنتج الآن
            </h2>
            <span class="badge-live-dot" id="pharmacyLiveBadge">
              <i class="fa-solid fa-circle text-success me-1 fa-fade"></i> محدث لحظياً
            </span>
          </div>
          <div id="availablePharmaciesList" aria-live="polite">
            <div class="alert alert-info d-flex align-items-center gap-2" role="status">
              <span class="spinner-border spinner-border-sm text-info"></span>
              <span>جاري فحص توافر المخزون في الصيدليات القريبة...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>
  <script src="../../js/core/spa-router.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/public/medicine-detail.js"></script>
</body>
</html>
