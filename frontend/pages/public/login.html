<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | تِرياق</title>
  <!-- Favicon / Brand Logo -->
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link rel="apple-touch-icon" href="../../assets/images/logo.png">
  <meta name="description" content="سجّل دخولك وكمّل من حيث وقفت في منصة تِرياق الطبية.">

    <!-- Anti-flicker Theme Script: Executed synchronously before ANY CSS or DOM paint -->
  <script>
    (function(){try{var saved=localStorage.getItem('teryak_theme')||localStorage.getItem('theme');var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;var isDark=saved==='dark'||(!saved&&prefersDark);if(isDark){document.documentElement.setAttribute('data-theme','dark');document.documentElement.classList.add('dark-theme');document.documentElement.style.backgroundColor='#0b1120';document.documentElement.style.colorScheme='dark';}else{document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.remove('dark-theme');document.documentElement.style.backgroundColor='#f8fafc';document.documentElement.style.colorScheme='light';}}catch(e){}})();
  </script>

  <!-- Typography: Cairo, Alexandria, Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/components.css">
  <link rel="stylesheet" href="../../css/components/modal.css">
  <link rel="stylesheet" href="../../css/components/validation.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/public/login.css">
</head>
<body data-page="login">

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <div id="spa-content">
    <main class="wrap">
      <div class="auth">
        <div style="width:min(460px,100%)">
          <!-- Centered Header Pitch -->
          <div class="ph center" style="padding-block:0 22px">
            <h1>أهلاً بيك تاني</h1>
            <p>سجّل دخولك وكمّل من حيث وقفت.</p>
          </div>

          <!-- Auth Card Form -->
          <form class="card auth-box" id="loginForm" novalidate>
            <!-- Role Selector Tabs -->
            <div class="tabs" role="tablist">
              <button type="button" class="tab on active" id="tabPatient">
                <i class="fa-solid fa-user me-1"></i> مريض
              </button>
              <button type="button" class="tab" id="tabPharmacist">
                <i class="fa-solid fa-prescription-bottle-medical me-1"></i> صيدلي
              </button>
            </div>

            <!-- Email Field with Label Above -->
            <div class="form-group">
              <label class="lbl" for="loginEmail">البريد الإلكتروني</label>
              <div class="input-wrap">
                <i class="fa-regular fa-envelope field-icon"></i>
                <input class="in has-icon" id="loginEmail" type="email" placeholder="name@email.com" required autocomplete="email">
              </div>
            </div>

            <!-- Password Field with Label Above & Eye Toggle -->
            <div class="form-group">
              <label class="lbl" for="password">كلمة المرور</label>
              <div class="password-box input-wrap">
                <i class="fa-solid fa-lock field-icon"></i>
                <input class="in has-icon" id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="eye-btn" aria-label="عرض / إخفاء كلمة المرور" tabindex="-1">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <!-- Submit Button -->
            <button class="btn btn-brand btn-block w-100" type="submit" style="margin-top:16px;">تسجيل الدخول</button>

            <!-- Divider -->
            <div class="or">أو</div>

            <!-- Google Auth Ghost Button -->
            <button class="btn btn-ghost btn-block w-100" id="loginWithG" type="button">
              <i class="fa-brands fa-google text-danger me-2"></i> الدخول بحساب Google
            </button>

            <!-- Switch to Registration Link -->
            <p class="sw">معندكش حساب؟ <a href="register.html">اعمل حساب جديد</a></p>
          </form>
        </div>
      </div>
    </main>

    <!-- Reusable App Footer -->
    <app-footer></app-footer>
  </div>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>
  <script src="../../js/core/spa-router.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/public/login.js"></script>
</body>
</html>
