<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | لوحة تحكم الصيدلي - الإشعارات</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="../../css/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/vendor/fontawesome/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/pharmacist/dashboard.css">
  <link rel="stylesheet" href="../../css/pages/pharmacist/notifications.css">
</head>
<body>

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <div class="dashboard-container">
    <!-- Reusable Pharmacist Sidebar -->
    <pharmacist-sidebar></pharmacist-sidebar>

    <div class="overlay" id="overlay"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="container">
        <h3 class="font-bold mb-4">مركز التنبيهات والإشعارات</h3>

        <!-- Notification 1 -->
        <div class="notification warning unread p-3 bg-white border rounded mb-3 shadow-sm d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <span class="dot bg-warning" style="width: 10px; height: 10px; border-radius: 50%;"></span>
            <div class="content">
              <h5 class="font-bold mb-1">مخزون أموكسيسيلين منخفض جداً (3 علب متبقية)</h5>
              <p class="text-muted mb-0" style="font-size: 13px;">منذ 30 دقيقة</p>
            </div>
          </div>
          <div class="icon warning-icon fs-3 text-warning">
            <i class="fa-solid fa-circle-exclamation"></i>
          </div>
        </div>

        <!-- Notification 2 -->
        <div class="notification info unread p-3 bg-white border rounded mb-3 shadow-sm d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <span class="dot bg-primary" style="width: 10px; height: 10px; border-radius: 50%;"></span>
            <div class="content">
              <h5 class="font-bold mb-1">طلب حجز جديد من أحمد محمد</h5>
              <p class="text-muted mb-0" style="font-size: 13px;">منذ ساعة</p>
            </div>
          </div>
          <div class="icon info-icon fs-3 text-primary">
            <i class="fa-regular fa-bell"></i>
          </div>
        </div>

        <!-- Notification 3 -->
        <div class="notification success p-3 bg-white border rounded mb-3 shadow-sm d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <div class="content">
              <h5 class="font-bold mb-1">تمت الموافقة على طلب تبادل المخزون مع صيدلية الشفاء</h5>
              <p class="text-muted mb-0" style="font-size: 13px;">منذ 3 ساعات</p>
            </div>
          </div>
          <div class="icon success-icon fs-3 text-success">
            <i class="fa-solid fa-circle-check"></i>
          </div>
        </div>

        <!-- Notification 4 -->
        <div class="notification danger p-3 bg-white border rounded mb-3 shadow-sm d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <div class="content">
              <h5 class="font-bold mb-1">انتهت صلاحية حجز فيتامين C لمريض لم يستلمه</h5>
              <p class="text-muted mb-0" style="font-size: 13px;">أمس</p>
            </div>
          </div>
          <div class="icon danger-icon fs-3 text-danger">
            <i class="fa-regular fa-circle-xmark"></i>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="../../js/vendor/bootstrap/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/pharmacist-sidebar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/pharmacist/notifications.js"></script>
</body>
</html>
