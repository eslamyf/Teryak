<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | لوحة تحكم الصيدلي - إدارة المخزون</title>

  <!-- Vendor CSS -->
    <!-- High-Performance Typography: Tajawal (Preferred by Egyptian & Modern Pharmacies) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Alexandria:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- SheetJS for Excel parsing (Local with CDN fallback) -->
  <script src="../../js/libs/xlsx.full.min.js"></script>
  <script>
    if (typeof XLSX === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\\/script>');
    }
  </script>
  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/pharmacist/dashboard.css">
  <link rel="stylesheet" href="../../css/pages/pharmacist/inventory.css">
</head>
<body>

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <div class="dashboard-container">
    <!-- Reusable Pharmacist Sidebar -->
    <pharmacist-sidebar></pharmacist-sidebar>

    <div class="overlay" id="overlay"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Page Header & Quick Summary -->
      <div class="inventory-header mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <h1 class="h3 font-bold mb-1 d-flex align-items-center gap-2">
              <i class="fa-solid fa-boxes-stacked text-success"></i> إدارة مخزون الصيدلية
            </h1>
            <p class="text-muted mb-0" style="font-size: 14px;">
              تتبع الأدوية والمنتجات الصحية والكميات المتوفرة
            </p>
          </div>
          <div class="d-flex gap-2 align-items-center flex-wrap">
            <button class="btn btn-outline-danger btn-sm font-bold" id="wipeAllInventoryBtn" title="مسح وتفريغ كافة بيانات المخزون الحالية">
              <i class="fa-solid fa-trash-can me-1"></i> مسح المخزون بالكامل
            </button>
            <button class="btn btn-outline-primary btn-sm font-bold" id="loadSample25Btn" title="تعبئة فورية بـ 25 دواء تجريبي مع الصور">
              <i class="fa-solid fa-wand-magic-sparkles me-1"></i> تعبئة 25 دواء تجريبي
            </button>
            <button class="btn btn-outline-success btn-sm font-bold" id="exportInventoryBtn" title="تصدير مخزون الصيدلية الحالي كملف CSV أو إكسل">
              <i class="fa-solid fa-file-export me-1"></i> تصدير المخزون
            </button>
            <button class="btn btn-primary btn-sm font-bold" id="bulkImportBtn" title="استيراد مئات الأدوية دفعة واحدة عبر ملف Excel أو CSV">
              <i class="fa-solid fa-file-import me-1"></i> استيراد شيت إكسل / CSV
            </button>
            <button class="btn btn-success btn-sm font-bold" id="addMedBtn">
              <i class="fa-solid fa-plus me-1"></i> إضافة منتج جديد
            </button>
          </div>
        </div>
      </div>

      <!-- Inventory KPI Stats Bar -->
      <div class="row g-3 mb-4" id="inventoryStatsRow">
        <div class="col-xl-3 col-sm-6 col-12">
          <div class="stat-card stat-total">
            <div class="stat-icon"><i class="fa-solid fa-pills"></i></div>
            <div class="stat-info">
              <span class="stat-label">إجمالي الأصناف</span>
              <h3 class="stat-value" id="statTotalItems">0</h3>
              <small class="stat-sub text-muted" id="statTotalQty">0 علبة بالمخزن</small>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6 col-12">
          <div class="stat-card stat-available">
            <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="stat-info">
              <span class="stat-label">أصناف متوفرة</span>
              <h3 class="stat-value text-success" id="statAvailable">0</h3>
              <small class="stat-sub text-success" id="statAvailablePct">0% من المخزون</small>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6 col-12">
          <div class="stat-card stat-low">
            <div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="stat-info">
              <span class="stat-label">أوشكت على النفاد (نواقص)</span>
              <h3 class="stat-value text-warning" id="statLowStock">0</h3>
              <small class="stat-sub text-warning">أقل من 5 علب</small>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6 col-12">
          <div class="stat-card stat-out">
            <div class="stat-icon"><i class="fa-solid fa-circle-xmark"></i></div>
            <div class="stat-info">
              <span class="stat-label">نفدت من المخزون</span>
              <h3 class="stat-value text-danger" id="statOutOfStock">0</h3>
              <small class="stat-sub text-danger">تحتاج إعادة طلب فوراً</small>
            </div>
          </div>
        </div>
      </div>

      <!-- Controls & Filter Toolbar -->
      <div class="inventory-toolbar card p-3 mb-4 shadow-sm border-0">
        <div class="row g-2 align-items-center">
          <!-- Search Bar -->
          <div class="col-lg-4 col-md-6 col-12">
            <div class="search-input-wrapper position-relative">
              <i class="fa-solid fa-magnifying-glass search-icon"></i>
              <input type="text" id="inventorySearchInput" class="form-control" placeholder="ابحث بالاسم، المادة الفعالة، مكان الرف...">
              <button type="button" class="btn-clear-search d-none" id="clearSearchBtn" title="مسح البحث">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>

          <!-- Status Filter -->
          <div class="col-lg-2 col-md-3 col-6">
            <select id="filterStatus" class="form-select">
              <option value="all">جميع الحالات</option>
              <option value="available">متوفر فقط</option>
              <option value="low">نواقص (محدود)</option>
              <option value="out">غير متوفر (0)</option>
            </select>
          </div>

          <!-- Category Filter -->
          <div class="col-lg-2 col-md-3 col-6">
            <select id="filterCategory" class="form-select">
              <option value="all">جميع الأقسام</option>
              <option value="مسكنات وخافض حرارة">مسكنات وخافض حرارة</option>
              <option value="مضادات حيوية">مضادات حيوية</option>
              <option value="أدوية البرد والإنفلونزا">أدوية البرد</option>
              <option value="فيتامينات ومكملات">فيتامينات ومكملات</option>
              <option value="أدوية الضغط والقلب">أدوية الضغط والقلب</option>
              <option value="أدوية السكري">أدوية السكري</option>
              <option value="جهاز هضمي ومعدة">جهاز هضمي</option>
              <option value="أدوية عامة">أدوية عامة</option>
              <option value="عناية شخصية">عناية شخصية</option>
              <option value="مستلزمات طبية">مستلزمات طبية</option>
            </select>
          </div>

          <!-- Sort Select -->
          <div class="col-lg-2 col-md-6 col-6">
            <select id="filterSort" class="form-select">
              <option value="newest">الأحدث إضافة</option>
              <option value="name_asc">الاسم (أ - ي)</option>
              <option value="qty_asc">الكمية (الأقل أولاً)</option>
              <option value="qty_desc">الكمية (الأكثر أولاً)</option>
              <option value="price_desc">السعر (الأعلى أولاً)</option>
              <option value="price_asc">السعر (الأقل أولاً)</option>
              <option value="expiry_asc">الصلاحية (الأقرب انتهاءً)</option>
            </select>
          </div>

          <!-- View Toggle & Quick Wipe Mode -->
          <div class="col-lg-2 col-md-6 col-6 d-flex justify-content-end gap-2">
            <div class="btn-group view-toggle-group flex-grow-1" role="group">
              <button type="button" class="btn btn-outline-secondary active" id="viewModeTableBtn" title="عرض كجدول منظم سريع">
                <i class="fa-solid fa-table-list me-1"></i> جدول
              </button>
              <button type="button" class="btn btn-outline-secondary" id="viewModeCardsBtn" title="عرض كشبكة بطاقات">
                <i class="fa-solid fa-grip me-1"></i> بطاقات
              </button>
            </div>
            <button type="button" class="btn btn-outline-danger btn-sm font-bold" id="quickWipeAllBtn" title="حذف كل المخزون الحالي">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Bulk Selection & Action Floating Bar -->
      <div id="bulkActionBar" class="card p-3 mb-3 shadow-sm border-0 d-none">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div class="d-flex align-items-center gap-3">
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-danger fs-6" id="selectedCountBadge">0</span>
              <strong class="text-danger fs-6" id="selectedCountText">أصناف محددة</strong>
            </div>
            <button type="button" class="btn btn-sm btn-link text-primary p-0 text-decoration-none font-bold" id="selectAllMatchingBtn">
              تحديد كل الأصناف في المخزون
            </button>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="cancelSelectionBtn">
              إلغاء التحديد
            </button>
            <button type="button" class="btn btn-danger btn-sm font-bold px-3" id="deleteSelectedBtn">
              <i class="fa-solid fa-trash-can me-1"></i> حذف الأصناف المحددة (<span id="deleteSelectedBtnCount">0</span>)
            </button>
          </div>
        </div>
      </div>

      <!-- Inventory Table / Cards Container -->
      <div id="inventoryContainer" class="inventory-container">
        <!-- Rendered dynamically by JS -->
      </div>

      <!-- Pagination and Page Size Footer -->
      <div class="inventory-pagination-wrapper card p-3 mt-3 shadow-sm border-0 d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted" style="font-size: 13.5px;" id="paginationSummary">عرض 0 من 0 منتج</span>
          <div class="d-inline-flex align-items-center gap-1 ms-3">
            <label class="text-muted small m-0" for="itemsPerPageSelect">لكل صفحة:</label>
            <select id="itemsPerPageSelect" class="form-select form-select-sm" style="width: 75px;">
              <option value="15" selected>15</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>

        <nav aria-label="تنقل صفحات المخزون">
          <ul class="pagination pagination-sm m-0" id="inventoryPagination">
            <!-- Dynamic page buttons -->
          </ul>
        </nav>
      </div>

      <div class="add-new-card text-center p-3 border rounded mt-3 font-bold" id="bottomAddMedBtn" style="cursor: pointer; background: #fff;">
        <i class="fa-solid fa-plus-circle me-1 text-success"></i> + إضافة منتج جديد للمخزون
      </div>
    </main>
  </div>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/pharmacist-sidebar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/pharmacist/inventory.js"></script>
</body>
</html>
