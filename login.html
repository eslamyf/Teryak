<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | تِرياق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Alexandria:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
</head>
<body data-page="login">
<div id="hd"></div>
<main class="wrap">
  <div class="auth"><div style="width:min(460px,100%)">
    <div class="ph center" style="padding-block:0 22px"><h1>أهلاً بيك تاني</h1><p>سجّل دخولك وكمّل من حيث وقفت.</p></div>
    <form class="card auth-box" onsubmit="event.preventDefault()">
      <div class="tabs" role="tablist"><button type="button" class="on">مريض</button><button type="button">صيدلي</button></div>
      <label class="lbl" for="e">البريد الإلكتروني</label><input class="in" id="e" type="email" placeholder="name@email.com" dir="ltr" style="text-align:start">
      <label class="lbl" for="p">كلمة المرور</label><input class="in" id="p" type="password" placeholder="••••••••" dir="ltr" style="text-align:start">
      <button class="btn btn-brand btn-block" type="submit">تسجيل الدخول</button>
      <div class="or">أو</div>
      <button class="btn btn-ghost btn-block" type="button">الدخول بحساب Google</button>
      <p class="sw">معندكش حساب؟ <a href="register.html">اعمل حساب جديد</a></p>
    </form>
  </div></div>
</main>
<div id="ft"></div>
<script>document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')})</script>
</body></html>
