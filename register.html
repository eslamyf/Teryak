<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء حساب جديد | تِرياق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Alexandria:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
</head>
<body data-page="register">
<div id="hd"></div>
<main class="wrap">
  <div class="auth"><div style="width:min(460px,100%)">
    <div class="ph center" style="padding-block:0 22px"><h1>إنشاء حساب جديد</h1><p>انضم لشبكة تِرياق الطبية.</p></div>
    <form class="card auth-box" id="regForm" onsubmit="event.preventDefault()">
      <div class="tabs" role="tablist"><button type="button" class="tab-btn on" data-role="patient">مريض</button><button type="button" class="tab-btn" data-role="pharmacist">صيدلي</button></div>
      <label class="lbl" for="name">الاسم بالكامل</label><input class="in" id="name" type="text" placeholder="مثلاً: أحمد محمود" required>
      <div id="pharmacyField" style="display:none;">
        <label class="lbl" for="phName">اسم الصيدلية</label><input class="in" id="phName" type="text" placeholder="صيدلية الشفاء">
      </div>
      <label class="lbl" for="email">البريد الإلكتروني</label><input class="in" id="email" type="email" placeholder="name@email.com" dir="ltr" style="text-align:start" required>
      <label class="lbl" for="phone">رقم الهاتف</label><input class="in" id="phone" type="tel" placeholder="010XXXXXXXX" dir="ltr" style="text-align:start" required>
      <label class="lbl" for="password">كلمة المرور</label><input class="in" id="password" type="password" placeholder="••••••••" dir="ltr" style="text-align:start" required>
      <button class="btn btn-brand btn-block" type="submit">إنشاء الحساب</button>
      <div class="or">أو</div>
      <button class="btn btn-ghost btn-block" type="button">التسجيل بحساب Google</button>
      <p class="sw">عندك حساب بالفعل؟ <a href="login.html">سجّل دخولك</a></p>
    </form>
  </div></div>
</main>
<div id="ft"></div>
<script>
const tabs = document.querySelectorAll('.tabs .tab-btn');
const phField = document.getElementById('pharmacyField');
tabs.forEach(b => b.onclick = () => {
  tabs.forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  if (phField) phField.style.display = b.dataset.role === 'pharmacist' ? 'block' : 'none';
});
document.getElementById('regForm').onsubmit = (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const role = document.querySelector('.tabs .on')?.dataset.role || 'patient';
  const newUser = { name, email, role };
  localStorage.setItem('currentUser', JSON.stringify(newUser));
  localStorage.setItem('haveAcount', 'true');
  localStorage.setItem('isLoggedIn', 'true');
  alert('تم إنشاء الحساب بنجاح!');
  window.location.href = 'index.html';
};
</script>
</body></html>
